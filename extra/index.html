<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Extra — FMG Brasil</title>
<meta name="robots" content="noindex, nofollow">
</head>
<body>
<style>
  :root {
    --bg: #f2f5f8;
    --card: #ffffff;
    --text: #1c232c;
    --text-soft: #5c6875;
    --border: #e1e7ee;
    --brand: #00a3e0;
    --brand-dark: #0084b8;
    --logo-text: #23282e;
    --logo-leaf: #a9adb3;
    --shadow: 0 1px 3px rgba(14, 30, 45, .08), 0 4px 12px rgba(14, 30, 45, .06);
    --shadow-hover: 0 4px 8px rgba(14, 30, 45, .10), 0 12px 24px rgba(14, 30, 45, .10);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11161c;
      --card: #1a212a;
      --text: #e8edf4;
      --text-soft: #98a4b2;
      --border: #29323e;
      --brand: #22b5ef;
      --brand-dark: #58c8f4;
      --logo-text: #f2f5f8;
      --logo-leaf: #8b9299;
      --shadow: 0 1px 3px rgba(0, 0, 0, .4);
      --shadow-hover: 0 6px 20px rgba(0, 0, 0, .5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #11161c;
    --card: #1a212a;
    --text: #e8edf4;
    --text-soft: #98a4b2;
    --border: #29323e;
    --brand: #22b5ef;
    --brand-dark: #58c8f4;
    --logo-text: #f2f5f8;
    --logo-leaf: #8b9299;
    --shadow: 0 1px 3px rgba(0, 0, 0, .4);
    --shadow-hover: 0 6px 20px rgba(0, 0, 0, .5);
  }
  :root[data-theme="light"] {
    --bg: #f2f5f8;
    --card: #ffffff;
    --text: #1c232c;
    --text-soft: #5c6875;
    --border: #e1e7ee;
    --brand: #00a3e0;
    --brand-dark: #0084b8;
    --logo-text: #23282e;
    --logo-leaf: #a9adb3;
    --shadow: 0 1px 3px rgba(14, 30, 45, .08), 0 4px 12px rgba(14, 30, 45, .06);
    --shadow-hover: 0 4px 8px rgba(14, 30, 45, .10), 0 12px 24px rgba(14, 30, 45, .10);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 36px 24px 20px;
    text-align: center;
  }
  .logo img {
    display: block;
    margin: 0 auto;
    width: min(320px, 70vw);
    height: auto;
  }
  .marca-dagua {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: .05;
    pointer-events: none;
    z-index: 0;
  }
  .marca-dagua img {
    width: min(85vw, 900px);
    height: auto;
  }
  img.so-escuro { display: none; }
  @media (prefers-color-scheme: dark) {
    img.so-claro { display: none; }
    img.so-escuro { display: block; }
  }
  :root[data-theme="light"] img.so-claro { display: block; }
  :root[data-theme="light"] img.so-escuro { display: none; }
  :root[data-theme="dark"] img.so-claro { display: none; }
  :root[data-theme="dark"] img.so-escuro { display: block; }
  header, main, footer { position: relative; z-index: 1; }
  header .titulo {
    margin: 18px 0 0;
    color: var(--text-soft);
    font-size: .95rem;
  }
  .busca-wrap {
    max-width: 480px;
    margin: 18px auto 0;
    position: relative;
  }
  .busca-wrap svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    stroke: var(--text-soft);
    pointer-events: none;
  }
  #busca {
    width: 100%;
    padding: 12px 16px 12px 42px;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--card);
    color: var(--text);
    outline: none;
    box-shadow: var(--shadow);
    transition: border-color .15s;
  }
  #busca:focus { border-color: var(--brand); }

  .google-busca {
    position: absolute;
    top: 16px;
    right: 20px;
    z-index: 2;
  }
  .google-busca svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 17px;
    height: 17px;
    pointer-events: none;
  }
  .google-busca input {
    width: 210px;
    padding: 9px 14px 9px 37px;
    font-size: .88rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--card);
    color: var(--text);
    outline: none;
    box-shadow: var(--shadow);
    transition: border-color .15s;
  }
  .google-busca input:focus { border-color: var(--brand); }
  @media (max-width: 860px) {
    .google-busca {
      position: relative;
      inset: auto;
      margin: 0 auto 20px;
      width: fit-content;
    }
  }
  main {
    max-width: 1240px;
    margin: 0 auto;
    padding: 24px 24px 60px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    align-items: start;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: box-shadow .15s, transform .15s;
  }
  .card:hover {
    box-shadow: var(--shadow-hover);
    transform: translateY(-2px);
  }
  .card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 18px;
    color: #fff;
    cursor: pointer;
    user-select: none;
    width: 100%;
    border: none;
    font-family: inherit;
    text-align: left;
  }
  .card-header:focus-visible {
    outline: 3px solid rgba(255, 255, 255, .7);
    outline-offset: -4px;
  }
  .card-header .seta {
    margin-left: auto;
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    transition: transform .2s ease;
  }
  .card-header .seta svg {
    display: block;
    width: 100%;
    height: 100%;
    stroke: #fff;
  }
  .card.fechado .seta { transform: rotate(-90deg); }
  .card.fechado ul { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .card-header .seta, .card, #busca { transition: none; }
  }
  .card-header .logo-chip {
    flex-shrink: 0;
    width: 36px;
    height: 32px;
    background: #fff;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3px 4px;
    box-shadow: 0 1px 2px rgba(0,0,0,.15);
  }
  .card-header .logo-chip img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .card-header h2 {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 600;
  }
  .card ul {
    list-style: none;
    margin: 0;
    padding: 8px 0;
  }
  .card li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 10px;
  }
  .card li + li { border-top: 1px solid var(--border); }
  .link-item {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 8px;
    text-decoration: none;
    color: var(--text);
    border-radius: 8px;
    min-width: 0;
  }
  .link-item:hover { background: rgba(0, 163, 224, .10); }
  .link-item .tipo {
    flex-shrink: 0;
    font-size: .95rem;
  }
  .link-item .textos { min-width: 0; }
  .link-item .nome {
    display: block;
    font-size: .93rem;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .link-item .destino {
    display: block;
    font-size: .76rem;
    color: var(--text-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .aba-lateral {
    position: fixed;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 14px 9px;
    border: none;
    border-radius: 0 10px 10px 0;
    background: var(--brand);
    color: #fff;
    font-family: inherit;
    font-size: .8rem;
    font-weight: 600;
    letter-spacing: .04em;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: padding .15s, background .15s;
  }
  .aba-lateral:hover { background: var(--brand-dark); padding-left: 13px; }
  .aba-lateral:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
  .aba-lateral svg { width: 18px; height: 18px; stroke: #fff; flex-shrink: 0; }
  .aba-lateral span { writing-mode: vertical-rl; transform: rotate(180deg); }

  .painel-fundo {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: rgba(10, 16, 24, .45);
    opacity: 0;
    visibility: hidden;
    transition: opacity .2s, visibility .2s;
  }
  .painel {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    z-index: 31;
    width: min(360px, 88vw);
    display: flex;
    flex-direction: column;
    background: var(--card);
    border-right: 1px solid var(--border);
    box-shadow: 4px 0 24px rgba(0, 0, 0, .18);
    transform: translateX(-100%);
    visibility: hidden;
    transition: transform .22s ease, visibility .22s;
  }
  body.painel-aberto .painel-fundo { opacity: 1; visibility: visible; }
  body.painel-aberto .painel { transform: none; visibility: visible; }
  .painel-topo {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 18px 18px 14px;
    border-bottom: 1px solid var(--border);
  }
  .painel-topo h2 { margin: 0; font-size: 1.05rem; }
  .painel-topo small { display: block; color: var(--text-soft); font-size: .78rem; font-weight: 400; margin-top: 2px; }
  .painel-fechar {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }
  .painel-fechar:hover { background: rgba(0, 163, 224, .10); }
  .painel-fechar svg { width: 18px; height: 18px; stroke: currentColor; }
  .painel-lista {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px 24px;
  }
  .painel-grupo + .painel-grupo { margin-top: 6px; }
  .painel-grupo h3 {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 12px 6px 4px;
    font-size: .72rem;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--text-soft);
  }
  .painel-grupo h3 i {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .painel-grupo a {
    display: block;
    padding: 8px 10px 8px 23px;
    border-radius: 7px;
    color: var(--text);
    text-decoration: none;
    font-size: .9rem;
  }
  .painel-grupo a:hover, .painel-grupo a:focus-visible { background: rgba(0, 163, 224, .10); outline: none; }
  @media (prefers-reduced-motion: reduce) {
    .painel, .painel-fundo, .aba-lateral { transition: none; }
  }
  .sem-resultado {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--text-soft);
    padding: 40px 0;
    display: none;
  }
  footer {
    text-align: center;
    color: var(--text-soft);
    font-size: .8rem;
    padding: 0 24px 32px;
  }
  footer .brasil { color: var(--brand); font-weight: 600; }
</style>

<div class="marca-dagua" aria-hidden="true">
  <img class="so-claro" src="../img/logo-fmg-claro.png" alt="">
  <img class="so-escuro" src="../img/logo-fmg-escuro.png" alt="">
</div>

<button type="button" class="aba-lateral" id="abrirPainel" aria-controls="painel" aria-expanded="false">

<div class="painel-fundo" id="painelFundo"></div>

      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
    </button>
  </div>
  <nav class="painel-lista" id="painelLista"></nav>
</aside>

<header>
  <form class="google-busca" action="https://www.google.com/search" method="get" target="_blank" rel="noopener">
    <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
    <input type="search" name="q" placeholder="Pesquisar no Google..." autocomplete="off">
  </form>
  <div class="logo">
    <a href="https://www.fmgbrasil.dev.br/" target="_blank" rel="noopener" title="Abrir o site da FMG">
    <img class="so-claro" src="../img/logo-fmg-claro.png" alt="FMG Brasil — Organização Contábil">
    <img class="so-escuro" src="../img/logo-fmg-escuro.png" alt="FMG Brasil — Organização Contábil">
  </a>
  </div>
  <p class="titulo">Portal Extra — projetos</p>
  <div class="busca-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/>
    </svg>
    <input id="busca" type="search" placeholder="Buscar projeto..." autocomplete="off">
  </div>
</header>

<main id="grade">
  <div class="sem-resultado" id="semResultado">Nenhum atalho encontrado 🔍</div>
</main>

<footer>
  FMG <span class="brasil">BRASIL</span> — Organização Contábil
</footer>

const grade = document.getElementById("grade");
const semResultado = document.getElementById("semResultado");

function criarLink(link) {
  const li = document.createElement("li");

  const a = document.createElement("a");
  a.className = "link-item";
  a.href = link.url;
  a.target = "_blank";
  a.rel = "noopener";
  a.innerHTML =
    `<span class="tipo">🌐</span>` +
    `<span class="textos"><span class="nome"></span><span class="destino"></span></span>`;
  a.querySelector(".nome").textContent = link.nome;
  a.querySelector(".destino").textContent = link.url;
  a.dataset.busca = (link.nome + " " + link.url).toLowerCase();
  li.appendChild(a);

  return li;
}

function montar() {
  DEPARTAMENTOS.forEach(dep => {
    const card = document.createElement("section");
    card.className = "card fechado";   // caixas começam recolhidas
    card.dataset.nome = dep.nome.toLowerCase();

    const cabecalho = document.createElement("button");
    cabecalho.type = "button";
    cabecalho.className = "card-header";
    cabecalho.style.background = dep.cor;
    cabecalho.setAttribute("aria-expanded", "false");
    cabecalho.innerHTML =
      `<span class="logo-chip"><img src="${MARCA_FMG}" alt=""></span><h2></h2>` +
      `<span class="seta"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span>`;
    cabecalho.querySelector("h2").textContent = dep.nome;
    cabecalho.addEventListener("click", () => {
      const fechado = card.classList.toggle("fechado");
      cabecalho.setAttribute("aria-expanded", String(!fechado));
    });
    card.appendChild(cabecalho);

    const ul = document.createElement("ul");
    dep.links.forEach(link => ul.appendChild(criarLink(link)));
    card.appendChild(ul);

    grade.insertBefore(card, semResultado);
  });
}

function filtrar(termo) {
  termo = termo.trim().toLowerCase();
  let visiveis = 0;
  document.querySelectorAll(".card").forEach(card => {
    const bateDep = card.dataset.nome.includes(termo);
    let linksVisiveis = 0;
    card.querySelectorAll("li").forEach(li => {
      const bate = bateDep || li.querySelector(".link-item").dataset.busca.includes(termo);
      li.style.display = bate ? "" : "none";
      if (bate) linksVisiveis++;
    });
    card.style.display = linksVisiveis ? "" : "none";
    // busca ativa abre as caixas com resultado; busca vazia recolhe tudo
    const abrir = termo && linksVisiveis;
    card.classList.toggle("fechado", !abrir);
    card.querySelector(".card-header").setAttribute("aria-expanded", String(!!abrir));
    if (linksVisiveis) visiveis++;
  });
  semResultado.style.display = visiveis ? "none" : "block";
}

function montarPainel() {
  const lista = document.getElementById("painelLista");
  let total = 0;
  DEPARTAMENTOS.forEach(dep => {
    const grupo = document.createElement("div");
    grupo.className = "painel-grupo";
    const titulo = document.createElement("h3");
    titulo.innerHTML = `<i></i><span></span>`;
    titulo.querySelector("i").style.background = dep.cor;
    titulo.querySelector("span").textContent = dep.nome;
    grupo.appendChild(titulo);
    dep.links.forEach(link => {
      const a = document.createElement("a");
      a.href = link.url;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = link.nome;
      grupo.appendChild(a);
      total++;
    });
    lista.appendChild(grupo);
  });
  document.getElementById("painelTotal").textContent = `${total} atalhos em ${DEPARTAMENTOS.length} departamentos`;

  const abrir = document.getElementById("abrirPainel");
  const fechar = document.getElementById("fecharPainel");
  const alternar = aberto => {
    document.body.classList.toggle("painel-aberto", aberto);
    abrir.setAttribute("aria-expanded", String(aberto));
    if (aberto) fechar.focus(); else abrir.focus();
  };
  abrir.addEventListener("click", () => alternar(true));
  fechar.addEventListener("click", () => alternar(false));
  document.getElementById("painelFundo").addEventListener("click", () => alternar(false));
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && document.body.classList.contains("painel-aberto")) alternar(false);
  });
}

document.getElementById("busca").addEventListener("input", e => filtrar(e.target.value));
montar();
montarPainel();
</script>
