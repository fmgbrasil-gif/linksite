<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Atalhos — FMG Brasil</title>
</head>
<body>
<style>
  :root {
    --bg: #f2f5f8;
    --card: #ffffff;
    --text: #1c232c;
    --text-soft: #5c6875;
    --border: #e1e7ee;
    --brand: #00a3e0;
    --brand-dark: #0084b8;
    --logo-text: #23282e;
    --logo-leaf: #a9adb3;
    --shadow: 0 1px 3px rgba(14, 30, 45, .08), 0 4px 12px rgba(14, 30, 45, .06);
    --shadow-hover: 0 4px 8px rgba(14, 30, 45, .10), 0 12px 24px rgba(14, 30, 45, .10);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11161c;
      --card: #1a212a;
      --text: #e8edf4;
      --text-soft: #98a4b2;
      --border: #29323e;
      --brand: #22b5ef;
      --brand-dark: #58c8f4;
      --logo-text: #f2f5f8;
      --logo-leaf: #8b9299;
      --shadow: 0 1px 3px rgba(0, 0, 0, .4);
      --shadow-hover: 0 6px 20px rgba(0, 0, 0, .5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #11161c;
    --card: #1a212a;
    --text: #e8edf4;
    --text-soft: #98a4b2;
    --border: #29323e;
    --brand: #22b5ef;
    --brand-dark: #58c8f4;
    --logo-text: #f2f5f8;
    --logo-leaf: #8b9299;
    --shadow: 0 1px 3px rgba(0, 0, 0, .4);
    --shadow-hover: 0 6px 20px rgba(0, 0, 0, .5);
  }
  :root[data-theme="light"] {
    --bg: #f2f5f8;
    --card: #ffffff;
    --text: #1c232c;
    --text-soft: #5c6875;
    --border: #e1e7ee;
    --brand: #00a3e0;
    --brand-dark: #0084b8;
    --logo-text: #23282e;
    --logo-leaf: #a9adb3;
    --shadow: 0 1px 3px rgba(14, 30, 45, .08), 0 4px 12px rgba(14, 30, 45, .06);
    --shadow-hover: 0 4px 8px rgba(14, 30, 45, .10), 0 12px 24px rgba(14, 30, 45, .10);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 36px 24px 20px;
    text-align: center;
  }
  .logo img {
    display: block;
    margin: 0 auto;
    width: min(320px, 70vw);
    height: auto;
  }
  .marca-dagua {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: .05;
    pointer-events: none;
    z-index: 0;
  }
  .marca-dagua img {
    width: min(85vw, 900px);
    height: auto;
  }
  img.so-escuro { display: none; }
  @media (prefers-color-scheme: dark) {
    img.so-claro { display: none; }
    img.so-escuro { display: block; }
  }
  :root[data-theme="light"] img.so-claro { display: block; }
  :root[data-theme="light"] img.so-escuro { display: none; }
  :root[data-theme="dark"] img.so-claro { display: none; }
  :root[data-theme="dark"] img.so-escuro { display: block; }
  header, main, footer { position: relative; z-index: 1; }
  header .titulo {
    margin: 18px 0 0;
    color: var(--text-soft);
    font-size: .95rem;
  }
  .busca-wrap {
    max-width: 480px;
    margin: 18px auto 0;
    position: relative;
  }
  .busca-wrap svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    stroke: var(--text-soft);
    pointer-events: none;
  }
  #busca {
    width: 100%;
    padding: 12px 16px 12px 42px;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--card);
    color: var(--text);
    outline: none;
    box-shadow: var(--shadow);
    transition: border-color .15s;
  }
  #busca:focus { border-color: var(--brand); }

  .google-busca {
    position: absolute;
    top: 16px;
    right: 20px;
    z-index: 2;
  }
  .google-busca svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 17px;
    height: 17px;
    pointer-events: none;
  }
  .google-busca input {
    width: 210px;
    padding: 9px 14px 9px 37px;
    font-size: .88rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--card);
    color: var(--text);
    outline: none;
    box-shadow: var(--shadow);
    transition: border-color .15s;
  }
  .google-busca input:focus { border-color: var(--brand); }
  @media (max-width: 860px) {
    .google-busca {
      position: static;
      margin: 16px auto 0;
      width: fit-content;
    }
  }
  main {
    max-width: 1240px;
    margin: 0 auto;
    padding: 24px 24px 60px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    align-items: start;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: box-shadow .15s, transform .15s;
  }
  .card:hover {
    box-shadow: var(--shadow-hover);
    transform: translateY(-2px);
  }
  .card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 18px;
    color: #fff;
    cursor: pointer;
    user-select: none;
    width: 100%;
    border: none;
    font-family: inherit;
    text-align: left;
  }
  .card-header:focus-visible {
    outline: 3px solid rgba(255, 255, 255, .7);
    outline-offset: -4px;
  }
  .card-header .seta {
    margin-left: auto;
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    transition: transform .2s ease;
  }
  .card-header .seta svg {
    display: block;
    width: 100%;
    height: 100%;
    stroke: #fff;
  }
  .card.fechado .seta { transform: rotate(-90deg); }
  .card.fechado ul { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .card-header .seta, .card, #busca { transition: none; }
  }
  .card-header .logo-chip {
    flex-shrink: 0;
    width: 36px;
    height: 32px;
    background: #fff;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3px 4px;
    box-shadow: 0 1px 2px rgba(0,0,0,.15);
  }
  .card-header .logo-chip img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .card-header h2 {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 600;
  }
  .card ul {
    list-style: none;
    margin: 0;
    padding: 8px 0;
  }
  .card li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 10px;
  }
  .card li + li { border-top: 1px solid var(--border); }
  .link-item {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 8px;
    text-decoration: none;
    color: var(--text);
    border-radius: 8px;
    min-width: 0;
  }
  .link-item:hover { background: rgba(0, 163, 224, .10); }
  .link-item .tipo {
    flex-shrink: 0;
    font-size: .95rem;
  }
  .link-item .textos { min-width: 0; }
  .link-item .nome {
    display: block;
    font-size: .93rem;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .link-item .destino {
    display: block;
    font-size: .76rem;
    color: var(--text-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sem-resultado {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--text-soft);
    padding: 40px 0;
    display: none;
  }
  footer {
    text-align: center;
    color: var(--text-soft);
    font-size: .8rem;
    padding: 0 24px 32px;
  }
  footer .brasil { color: var(--brand); font-weight: 600; }
</style>

const grade = document.getElementById("grade");
const semResultado = document.getElementById("semResultado");

function criarLink(link) {
  const li = document.createElement("li");

  const a = document.createElement("a");
  a.className = "link-item";
  a.href = link.url;
  a.target = "_blank";
  a.rel = "noopener";
  a.innerHTML =
    `<span class="tipo">🌐</span>` +
    `<span class="textos"><span class="nome"></span><span class="destino"></span></span>`;
  a.querySelector(".nome").textContent = link.nome;
  a.querySelector(".destino").textContent = link.url;
  a.dataset.busca = (link.nome + " " + link.url).toLowerCase();
  li.appendChild(a);

  return li;
}

function montar() {
  DEPARTAMENTOS.forEach(dep => {
    const card = document.createElement("section");
    card.className = "card fechado";   // caixas começam recolhidas
    card.dataset.nome = dep.nome.toLowerCase();

    const cabecalho = document.createElement("button");
    cabecalho.type = "button";
    cabecalho.className = "card-header";
    cabecalho.style.background = dep.cor;
    cabecalho.setAttribute("aria-expanded", "false");
    cabecalho.innerHTML =
      `<span class="logo-chip"><img src="${MARCA_FMG}" alt=""></span><h2></h2>` +
      `<span class="seta"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span>`;
    cabecalho.querySelector("h2").textContent = dep.nome;
    cabecalho.addEventListener("click", () => {
      const fechado = card.classList.toggle("fechado");
      cabecalho.setAttribute("aria-expanded", String(!fechado));
    });
    card.appendChild(cabecalho);

    const ul = document.createElement("ul");
    dep.links.forEach(link => ul.appendChild(criarLink(link)));
    card.appendChild(ul);

    grade.insertBefore(card, semResultado);
  });
}

function filtrar(termo) {
  termo = termo.trim().toLowerCase();
  let visiveis = 0;
  document.querySelectorAll(".card").forEach(card => {
    const bateDep = card.dataset.nome.includes(termo);
    let linksVisiveis = 0;
    card.querySelectorAll("li").forEach(li => {
      const bate = bateDep || li.querySelector(".link-item").dataset.busca.includes(termo);
      li.style.display = bate ? "" : "none";
      if (bate) linksVisiveis++;
    });
    card.style.display = linksVisiveis ? "" : "none";
    // busca ativa abre as caixas com resultado; busca vazia recolhe tudo
    const abrir = termo && linksVisiveis;
    card.classList.toggle("fechado", !abrir);
    card.querySelector(".card-header").setAttribute("aria-expanded", String(!!abrir));
    if (linksVisiveis) visiveis++;
  });
  semResultado.style.display = visiveis ? "none" : "block";
}

document.getElementById("busca").addEventListener("input", e => filtrar(e.target.value));
montar();
</script>
