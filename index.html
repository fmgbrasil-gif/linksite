<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Atalhos — Departamentos</title>
<style>
  :root {
    --bg: #f1f4f9;
    --card: #ffffff;
    --text: #1e2530;
    --text-soft: #5b6675;
    --border: #e2e8f0;
    --shadow: 0 1px 3px rgba(16, 24, 40, .08), 0 4px 12px rgba(16, 24, 40, .06);
    --shadow-hover: 0 4px 8px rgba(16, 24, 40, .10), 0 12px 24px rgba(16, 24, 40, .10);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161d;
      --card: #1b212b;
      --text: #e8edf4;
      --text-soft: #9aa6b5;
      --border: #2a3341;
      --shadow: 0 1px 3px rgba(0, 0, 0, .4);
      --shadow-hover: 0 6px 20px rgba(0, 0, 0, .5);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 36px 24px 20px;
    text-align: center;
  }
  header h1 {
    margin: 0 0 6px;
    font-size: 1.7rem;
    letter-spacing: -.01em;
  }
  header p {
    margin: 0;
    color: var(--text-soft);
    font-size: .95rem;
  }
  .busca-wrap {
    max-width: 480px;
    margin: 20px auto 0;
    position: relative;
  }
  .busca-wrap svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    stroke: var(--text-soft);
    pointer-events: none;
  }
  #busca {
    width: 100%;
    padding: 12px 16px 12px 42px;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--card);
    color: var(--text);
    outline: none;
    box-shadow: var(--shadow);
    transition: border-color .15s;
  }
  #busca:focus { border-color: #6a8dd8; }

  main {
    max-width: 1240px;
    margin: 0 auto;
    padding: 24px 24px 60px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    align-items: start;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: box-shadow .15s, transform .15s;
  }
  .card:hover {
    box-shadow: var(--shadow-hover);
    transform: translateY(-2px);
  }
  .card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 18px;
    color: #fff;
  }
  .card-header .icone {
    font-size: 1.5rem;
    line-height: 1;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,.2));
  }
  .card-header h2 {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 600;
  }
  .card ul {
    list-style: none;
    margin: 0;
    padding: 8px 0;
  }
  .card li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 10px;
  }
  .card li + li { border-top: 1px solid var(--border); }
  .link-item {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 8px;
    text-decoration: none;
    color: var(--text);
    border-radius: 8px;
    min-width: 0;
  }
  .link-item:hover { background: rgba(120, 144, 180, .12); }
  .link-item .tipo {
    flex-shrink: 0;
    font-size: .95rem;
  }
  .link-item .textos { min-width: 0; }
  .link-item .nome {
    display: block;
    font-size: .93rem;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .link-item .destino {
    display: block;
    font-size: .76rem;
    color: var(--text-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    direction: rtl;      /* mostra o fim do caminho quando cortado */
    text-align: left;
  }
  .btn-copiar {
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-soft);
    border-radius: 8px;
    padding: 6px 9px;
    font-size: .75rem;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .btn-copiar:hover { background: rgba(120, 144, 180, .15); color: var(--text); }
  .btn-copiar.copiado { color: #1d9d5f; border-color: #1d9d5f; }

  .sem-resultado {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--text-soft);
    padding: 40px 0;
    display: none;
  }
  footer {
    text-align: center;
    color: var(--text-soft);
    font-size: .8rem;
    padding: 0 24px 32px;
  }
</style>
</head>
<body>

<header>
  <h1>🏢 Portal de Atalhos</h1>
  <p>Acesso rápido aos sistemas e pastas de cada departamento</p>
  <div class="busca-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/>
    </svg>
    <input id="busca" type="search" placeholder="Buscar atalho ou departamento..." autocomplete="off">
  </div>
</header>

<main id="grade">
  <div class="sem-resultado" id="semResultado">Nenhum atalho encontrado 🔍</div>
</main>

<footer>
  Dica: caminhos locais têm um botão <strong>Copiar</strong> — cole no Explorer de Arquivos (Windows + E → barra de endereço).
</footer>

<script>
/* ============================================================
   COMO EDITAR ESTE PORTAL
   ------------------------------------------------------------
   Cada departamento é um objeto na lista DEPARTAMENTOS abaixo:

   {
     nome:  "Nome do departamento",
     icone: "📁",                      // qualquer emoji
     cor:   "#3b6fd4",                 // cor da faixa do cabeçalho
     links: [
       // Atalho de SITE (abre em nova aba):
       { nome: "Nome do atalho", url: "https://exemplo.com" },

       // Atalho de CAMINHO LOCAL / REDE (mostra botão Copiar):
       { nome: "Pasta X", caminho: "\\\\servidor\\pasta\\subpasta" },
       { nome: "Pasta Y", caminho: "C:\\Users\\Publico\\Documentos" },
     ]
   }

   ATENÇÃO: em caminhos, cada barra invertida "\" deve ser
   escrita em dobro "\\" (por isso \\\\servidor = \\servidor).

   Sobre caminhos locais: por segurança, navegadores bloqueiam
   abrir file:// a partir de páginas. O portal tenta abrir mesmo
   assim (funciona se o arquivo for aberto localmente em alguns
   navegadores) e sempre oferece o botão "Copiar" como garantia.
   ============================================================ */

const DEPARTAMENTOS = [
  {
    nome: "Recursos Humanos",
    icone: "👥",
    cor: "#3b6fd4",
    links: [
      { nome: "Portal do RH", url: "https://exemplo.com/rh" },
      { nome: "Folha de ponto", url: "https://exemplo.com/ponto" },
      { nome: "Pasta de documentos do RH", caminho: "\\\\servidor\\RH\\Documentos" },
    ]
  },
  {
    nome: "Financeiro",
    icone: "💰",
    cor: "#1d9d5f",
    links: [
      { nome: "Sistema financeiro", url: "https://exemplo.com/financeiro" },
      { nome: "Emissão de NF-e", url: "https://www.nfe.fazenda.gov.br" },
      { nome: "Planilhas do setor", caminho: "\\\\servidor\\Financeiro\\Planilhas" },
    ]
  },
  {
    nome: "TI / Suporte",
    icone: "🖥️",
    cor: "#7048c9",
    links: [
      { nome: "Abrir chamado", url: "https://exemplo.com/chamados" },
      { nome: "Base de conhecimento", url: "https://exemplo.com/wiki" },
      { nome: "Instaladores", caminho: "\\\\servidor\\TI\\Instaladores" },
    ]
  },
  {
    nome: "Comercial",
    icone: "📈",
    cor: "#d4762b",
    links: [
      { nome: "CRM", url: "https://exemplo.com/crm" },
      { nome: "Tabela de preços", caminho: "\\\\servidor\\Comercial\\Precos" },
      { nome: "Propostas", caminho: "\\\\servidor\\Comercial\\Propostas" },
    ]
  },
  {
    nome: "Administrativo",
    icone: "🗂️",
    cor: "#c23b6b",
    links: [
      { nome: "Intranet", url: "https://exemplo.com/intranet" },
      { nome: "Modelos de documentos", caminho: "\\\\servidor\\Adm\\Modelos" },
    ]
  },
];

/* ------------------ daqui pra baixo não precisa mexer ------------------ */

const grade = document.getElementById("grade");
const semResultado = document.getElementById("semResultado");

function caminhoParaFileUrl(caminho) {
  // \\servidor\pasta -> file://servidor/pasta | C:\pasta -> file:///C:/pasta
  const barras = caminho.replace(/\\/g, "/");
  return barras.startsWith("//") ? "file:" + barras : "file:///" + barras;
}

function criarLink(link) {
  const li = document.createElement("li");
  const ehLocal = !!link.caminho;
  const destino = ehLocal ? link.caminho : link.url;

  const a = document.createElement("a");
  a.className = "link-item";
  a.href = ehLocal ? caminhoParaFileUrl(link.caminho) : link.url;
  if (!ehLocal) { a.target = "_blank"; a.rel = "noopener"; }
  a.innerHTML =
    `<span class="tipo">${ehLocal ? "📁" : "🌐"}</span>` +
    `<span class="textos"><span class="nome"></span><span class="destino"></span></span>`;
  a.querySelector(".nome").textContent = link.nome;
  a.querySelector(".destino").textContent = destino;
  a.dataset.busca = (link.nome + " " + destino).toLowerCase();
  li.appendChild(a);

  if (ehLocal) {
    const btn = document.createElement("button");
    btn.className = "btn-copiar";
    btn.textContent = "Copiar";
    btn.title = "Copiar caminho: " + link.caminho;
    btn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(link.caminho);
      } catch {
        // fallback para quando a página é aberta via file:// sem permissão de clipboard
        const tmp = document.createElement("textarea");
        tmp.value = link.caminho;
        document.body.appendChild(tmp);
        tmp.select();
        document.execCommand("copy");
        tmp.remove();
      }
      btn.textContent = "Copiado!";
      btn.classList.add("copiado");
      setTimeout(() => { btn.textContent = "Copiar"; btn.classList.remove("copiado"); }, 1600);
    });
    li.appendChild(btn);
  }
  return li;
}

function montar() {
  DEPARTAMENTOS.forEach(dep => {
    const card = document.createElement("section");
    card.className = "card";
    card.dataset.nome = dep.nome.toLowerCase();

    const cabecalho = document.createElement("div");
    cabecalho.className = "card-header";
    cabecalho.style.background = dep.cor;
    cabecalho.innerHTML = `<span class="icone">${dep.icone}</span><h2></h2>`;
    cabecalho.querySelector("h2").textContent = dep.nome;
    card.appendChild(cabecalho);

    const ul = document.createElement("ul");
    dep.links.forEach(link => ul.appendChild(criarLink(link)));
    card.appendChild(ul);

    grade.insertBefore(card, semResultado);
  });
}

function filtrar(termo) {
  termo = termo.trim().toLowerCase();
  let visiveis = 0;
  document.querySelectorAll(".card").forEach(card => {
    const bateDep = card.dataset.nome.includes(termo);
    let linksVisiveis = 0;
    card.querySelectorAll("li").forEach(li => {
      const bate = bateDep || li.querySelector(".link-item").dataset.busca.includes(termo);
      li.style.display = bate ? "" : "none";
      if (bate) linksVisiveis++;
    });
    card.style.display = linksVisiveis ? "" : "none";
    if (linksVisiveis) visiveis++;
  });
  semResultado.style.display = visiveis ? "none" : "block";
}

document.getElementById("busca").addEventListener("input", e => filtrar(e.target.value));
montar();
</script>
</body>
</html>
